<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة تهنئة تفاعلية 🎉</title>
  <!-- خط عربي جميل من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- مكتبة الألعاب النارية/الاحتفال -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #fff;
      padding: 20px;
    }

    .card-container {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
    }

    /* تصميم البطاقة مغلقة */
    .envelope {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transition: transform 0.6s ease, opacity 0.6s ease;
      cursor: pointer;
    }

    .envelope:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: #fbbf24;
    }

    .gift-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1) rotate(5deg); }
    }

    /* محتوى التهنئة المخفي */
    .greeting-card {
      display: none;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border: 2px solid #fbbf24;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
      animation: openCard 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes openCard {
      from { opacity: 0; transform: rotateX(-90deg) scale(0.8); }
      to { opacity: 1; transform: rotateX(0deg) scale(1); }
    }

    .badge {
      background: #fbbf24;
      color: #1e1b4b;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    p.message {
      font-size: 16px;
      line-height: 1.8;
      color: #e2e8f0;
      margin-bottom: 25px;
    }

    .btn-action {
      background: linear-gradient(45deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- الغلاف الأول قبل الفتح -->
    <div class="envelope" id="envelope" onclick="openGreeting()">
      <div class="gift-icon">🎁</div>
      <h2>لديك رسالة تهنئة خاصة!</h2>
      <p style="margin-top: 10px; color: #cbd5e1;">اضغط هنا لفتح البطاقة ✨</p>
    </div>

    <!-- بطاقة التهنئة التفاعلية -->
    <div class="greeting-card" id="greetingCard">
      <span class="badge">مناسبة خاصة ✨</span>
      <h1 id="title">أجمل التهاني والتبريكات 🎉</h1>
      <p class="message" id="message">
        أتمنى لك أيها الرائع أن تكون أيامك كلها فرح وسعادة، وأن يحقق الله لك كل ما تتمنى! دمت دائماً متميزاً وسعيداً. 🌟
      </p>
      <button class="btn-action" onclick="triggerConfetti()">إطلاق الاحتفال 🎊</button>
    </div>
  </div>

  <script>
    function openGreeting() {
      // إخفاء الغلاف وإظهار البطاقة
      document.getElementById('envelope').style.display = 'none';
      const card = document.getElementById('greetingCard');
      card.style.display = 'block';

      // إطلاق مؤثرات قصاصات الورق الاحتفالية
      triggerConfetti();
    }

    function triggerConfetti() {
      // تأثير القصاصات من الجانبين
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
